services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incident_app
      POSTGRES_PASSWORD: incident_app
      POSTGRES_DB: incident_status
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_app -d incident_status"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://incident_app:incident_app@postgres:5432/incident_status
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

volumes:
  pgdata:
